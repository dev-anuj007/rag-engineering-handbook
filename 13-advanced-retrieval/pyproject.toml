[project]
name = "13-advanced-retrieval"
version = "0.1.0"
description = "Advanced Hybrid Search, BM25 + Dense Fusion, RRF with ChromaDB and SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llama-index>=0.14.0",
    "llama-index-llms-google-genai",
    "llama-index-embeddings-google-genai",
    "llama-index-vector-stores-chroma",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
